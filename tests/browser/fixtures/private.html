<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Private self-contained page</title>
<body><h1>Private fixture</h1><button id="counter">Count: 0</button>
<script>let count = 0; document.querySelector('button').onclick = event => { event.target.textContent = 'Count: ' + (++count); };</script>
</body></html>
