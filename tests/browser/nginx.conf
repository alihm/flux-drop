worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    access_log off;
    upstream fixture { server fixture:8081; }
    server {
        listen 8443 ssl;
        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        location = / { proxy_pass http://fixture; }

        location ~ ^/(manage$|api/|unlock/|healthz$) {
            proxy_pass http://fixture;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Authorization "";
        }
        location / {
            include /etc/nginx/drop/project-headers.conf;
            proxy_pass http://fixture;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Authorization "";
        }
        location ~ ^/_files/public/(react|vue)\.js$ {
            internal;
            alias /generated/$1.js;
            include /etc/nginx/drop/project-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
        location ~ ^/_files/private/(react|vue)\.js$ {
            internal;
            alias /generated/$1.js;
            include /etc/nginx/drop/project-headers.conf;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
        location /_files/public/ {
            internal;
            alias /fixtures/;
            include /etc/nginx/drop/project-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
        location /_files/private/ {
            internal;
            alias /fixtures/;
            include /etc/nginx/drop/project-headers.conf;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
    }
}
