# Shared by the production boundary and the browser-isolation harness.
# Never add allow-same-origin. Every uploaded document is untrusted.
add_header Content-Security-Policy "sandbox allow-scripts; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control no-store always;
