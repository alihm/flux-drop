# The Go entrypoint enables publishing only with explicit staging configuration.
# Content can only be reached through a Go-authorized internal redirect.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    merge_slashes off;
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Do not log query strings, cookies, authorization headers, or request bodies.
    log_format minimal '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;

    upstream drop { server 127.0.0.1:8081; keepalive 16; }

    server {
        listen 8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ^~ /_drop_internal/files/ {
            internal;
            alias /data/projects/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
        location ^~ /_drop_internal/private/ {
            internal;
            alias /data/projects/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
        location ^~ /_drop_internal/ { return 404; }

        location ~ ^/(api/|healthz$|readyz$) {
            proxy_pass http://drop;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Peer-Hop "";
            proxy_set_header X-Drop-Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # This header will remain enforced on uploaded documents when serving
        # is enabled. Do not add allow-same-origin to fix application compatibility.
        location / {
            proxy_pass http://drop;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Peer-Hop "";
            proxy_set_header X-Drop-Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            proxy_buffering off;
        }
    }
}
