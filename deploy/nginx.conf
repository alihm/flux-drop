# Publishing is enabled by default in the passphrase-provisioned Flux image.
# Content can only be reached through a Go-authorized internal redirect.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 8192; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
    merge_slashes off;
    client_max_body_size 50m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Do not log query strings, cookies, authorization headers, or request bodies.
    log_format minimal '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    # Include sendfile/compression/slow-client time, which Go cannot measure.
    map $request_time $slow_request { default 0; ~^[1-9][0-9]*\. 1; }
    log_format slow '$remote_addr $request_method $status total=$request_time server_timing="$sent_http_server_timing"';
    access_log /dev/stderr slow if=$slow_request;

    upstream drop { server 127.0.0.1:8081; keepalive 64; }

    server {
        listen 8080 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location ^~ /_drop_internal/cache-public/ {
            internal;
            etag off;
            alias /var/lib/drop-cluster/storage-cache/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header ETag $upstream_http_etag always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
        location ^~ /_drop_internal/cache-private/ {
            internal;
            etag off;
            alias /var/lib/drop-cluster/storage-cache/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header ETag $upstream_http_etag always;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
        location ^~ /_drop_internal/files/ {
            internal;
            etag off;
            add_header ETag $upstream_http_etag always;
            alias /data/projects/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy cross-origin always;
        }
        location ^~ /_drop_internal/private/ {
            internal;
            etag off;
            add_header ETag $upstream_http_etag always;
            alias /data/projects/;
            disable_symlinks on;
            include /etc/nginx/drop/project-headers.conf;
            add_header Cross-Origin-Resource-Policy same-origin always;
        }
        location ^~ /_drop_internal/ { return 404; }

        location ~ ^/(api/|agent/mcp$|healthz$|readyz$) {
            proxy_pass http://drop;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Drop-Client-IP $remote_addr;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Peer-Hop "";
            proxy_set_header X-Drop-Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 630s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Uploaded documents remain on an opaque origin. Do not add
        # allow-same-origin to fix application compatibility.
        location / {
            proxy_pass http://drop;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Drop-Client-IP $remote_addr;
            proxy_set_header X-Drop-Peer "";
            proxy_set_header X-Drop-Peer-Hop "";
            proxy_set_header X-Drop-Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 630s;
            proxy_buffering off;
        }
    }
}
